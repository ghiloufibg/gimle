# A worked example of deploying gimle-gateway for real. This manifest alone is not enough to bring
# up a working gateway instance -- two tenant-scoped config keys still need to be written through
# the control plane's own /config/{tenantId}/{key} API before (or racing) this DaemonSet's
# instances start, since a workload manifest carries no config block of its own:
#
#   PUT /config/gimle-system/gateway.port
#     {"value": "8090", "encrypted": false}
#   PUT /config/gimle-system/gateway.routes
#     {"value": "FABRIC /greet com.gimle.examples.greeter.Greeter 1 greet STRING\n", "encrypted": false}
#
# See GatewayHooks's own javadoc for the two keys' exact meaning, and GatewayRouteConfig's own
# javadoc for the route-table format the second one holds.
#
# TLS termination at this instance's own listener is not a config key at all: it follows the same
# cluster-wide -Dgimle.transport.protocol=tls system property (plus -Dgimle.tls.certFile/keyFile/
# caFile) every other TLS-capable listener in this codebase reads -- set it on the node agent's own
# launch command and it's forwarded onto every worker JVM that agent spawns, this gateway's own
# worker included, with nothing gateway-specific to configure. Plaintext (the default) needs none
# of this. See GatewayHooks#createHttpServer's own javadoc for exactly how the swap happens.
#
# One thing about TLS *is* gateway-specific, and optional: a gateway routing several hostnames
# (HOST route lines) needs one certificate per hostname, since a client verifies what it is served
# against the hostname it dialled. A third config key binds them, selected per connection from the
# client's SNI extension, with the cluster-wide certificate above still serving any hostname not
# named here:
#
#   PUT /config/gimle-system/gateway.tlsCertificates
#     {"value": "orders.example.com /etc/gimle/tls/orders-cert.pem /etc/gimle/tls/orders-key.pem\n",
#      "encrypted": false}
#
# See GatewayTlsConfig's own javadoc for the format.
#
# tenantId: gimle-system only ever admits through a gimle:operators-group credential -- see
# ApiServer#rejectIfReservedSystemTenant. placement.requiredLabels: [edge] matches how an operator
# marks a machine as an edge node today: `-Dgimle.node.labels=edge` on that node's own AgentMain
# (AgentMain#nodeLabels) -- an existing mechanism, nothing further needed here.
kind: DaemonSet
name: gimle-gateway
module:
  name: com.gimle.gateway
  version: 1.0.0
artifactPath: gimle-gateway/target/gimle-gateway-0.1.0-alpha.2.jar
placement:
  requiredLabels:
    - edge
tenantId: gimle-system
