<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gimlé Saga</title>
<style>
  /* Gimlé operations console tokens (from gimle-console/src/styles.css), dark-default instrument
     panel. Painted explicitly so the page holds on any host ground; a manual toggle adds .light. */
  :root {
    --radius: 0.25rem;
    --font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-mono: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, "Cascadia Code", Consolas, monospace;

    --background: oklch(0.2 0.035 248);
    --foreground: oklch(0.92 0.07 158);
    --card: oklch(0.245 0.035 235);
    --card-2: oklch(0.275 0.035 230);
    --muted: oklch(0.27 0.035 220);
    --muted-foreground: oklch(0.72 0.05 172);
    --primary: oklch(0.79 0.14 172);
    --border: oklch(0.34 0.04 195);
    --signal: oklch(0.9 0.16 155);
    --sidebar: oklch(0.17 0.03 250);
    --sidebar-border: oklch(0.3 0.035 210);

    --ok: oklch(0.82 0.15 165);
    --warn: oklch(0.83 0.16 80);
    --bad: oklch(0.7 0.19 18);
    --info: oklch(0.78 0.1 200);
    --neutral: oklch(0.6 0.02 220);
    --gherkin: oklch(0.8 0.11 200);
    --junit: oklch(0.8 0.12 300);
    --ok-bg: oklch(0.32 0.07 165);
    --warn-bg: oklch(0.33 0.08 80);
    --bad-bg: oklch(0.32 0.1 18);
    --info-bg: oklch(0.3 0.05 200);
    --neutral-bg: oklch(0.3 0.02 220);
  }
  .light {
    --background: oklch(0.985 0.005 170);
    --foreground: oklch(0.22 0.03 220);
    --card: oklch(1 0 0);
    --card-2: oklch(0.97 0.01 185);
    --muted: oklch(0.955 0.012 180);
    --muted-foreground: oklch(0.48 0.03 200);
    --primary: oklch(0.55 0.13 172);
    --border: oklch(0.9 0.015 185);
    --signal: oklch(0.52 0.14 168);
    --sidebar: oklch(0.965 0.01 190);
    --sidebar-border: oklch(0.9 0.015 185);

    --ok: oklch(0.52 0.14 165);
    --warn: oklch(0.62 0.17 70);
    --bad: oklch(0.55 0.21 20);
    --info: oklch(0.5 0.09 215);
    --neutral: oklch(0.55 0.01 220);
    --gherkin: oklch(0.48 0.1 215);
    --junit: oklch(0.5 0.14 300);
    --ok-bg: oklch(0.94 0.05 165);
    --warn-bg: oklch(0.94 0.08 80);
    --bad-bg: oklch(0.95 0.05 20);
    --info-bg: oklch(0.94 0.03 215);
    --neutral-bg: oklch(0.95 0.008 220);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--background);
    color: var(--foreground);
    font-family: var(--font-sans);
    font-size: 14px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: var(--font-mono); }
  .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  a { color: var(--primary); }

  .app { display: grid; grid-template-columns: 248px 1fr; min-height: 100vh; }

  /* ---- Sidebar ---- */
  aside {
    background: var(--sidebar);
    border-right: 1px solid var(--sidebar-border);
    display: flex; flex-direction: column;
    position: sticky; top: 0; height: 100vh;
  }
  .brand { padding: 20px 18px 14px; border-bottom: 1px solid var(--sidebar-border); }
  .kicker { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted-foreground); }
  .brand h1 { margin: 4px 0 0; font-size: 20px; font-weight: 650; letter-spacing: -0.01em; }
  nav { padding: 10px 10px; display: flex; flex-direction: column; gap: 2px; flex: 1; }
  .navitem {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 8px 10px; border-radius: var(--radius); cursor: pointer; color: var(--foreground);
    border: 1px solid transparent; font-size: 13px; user-select: none;
  }
  .navitem:hover { background: var(--muted); }
  .navitem.active { background: var(--muted); border-color: var(--border); color: var(--primary); }
  .navitem.disabled { opacity: 0.4; cursor: not-allowed; }
  .navitem .cnt { font-family: var(--font-mono); font-size: 11px; color: var(--muted-foreground); }
  .sidefoot { padding: 12px 16px; border-top: 1px solid var(--sidebar-border); font-size: 12px; }
  .sourcechip {
    display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 10px;
    text-transform: uppercase; letter-spacing: 0.06em; padding: 2px 8px; border-radius: 999px;
    border: 1px solid var(--warn); color: var(--warn); background: var(--warn-bg);
  }
  .outcome-dot { width: 9px; height: 9px; border-radius: 999px; display: inline-block; }
  .filebtn {
    margin-top: 10px; display: block; width: 100%; text-align: center; cursor: pointer;
    padding: 7px 10px; border-radius: var(--radius); border: 1px solid var(--border);
    background: var(--card); color: var(--foreground); font-size: 12px; font-family: var(--font-sans);
  }
  .filebtn:hover { border-color: var(--primary); color: var(--primary); }
  .themebtn {
    margin-top: 8px; width: 100%; cursor: pointer; padding: 6px 10px; border-radius: var(--radius);
    border: 1px solid var(--border); background: transparent; color: var(--muted-foreground); font-size: 12px;
  }
  .themebtn:hover { color: var(--foreground); }

  /* ---- Main ---- */
  main { padding: 26px 30px 60px; max-width: 1100px; }
  .screen-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 18px; }
  .screen-head h2 { margin: 0; font-size: 20px; font-weight: 650; }
  .screen-head .sub { color: var(--muted-foreground); font-size: 13px; }

  .grid { display: grid; gap: 14px; }
  .tiles { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px;
  }
  .tile .label { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted-foreground); }
  .tile .val { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 26px; font-weight: 600; margin-top: 4px; }
  .tile .val small { font-size: 13px; color: var(--muted-foreground); font-weight: 500; }

  .banner {
    display: flex; align-items: center; gap: 18px; padding: 18px 20px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--card); margin-bottom: 16px;
  }
  .verdict { font-size: 30px; font-weight: 700; letter-spacing: 0.02em; }
  .verdict.ok { color: var(--ok); }
  .verdict.bad { color: var(--bad); }
  .banner .meta { display: grid; grid-template-columns: repeat(auto-fit,minmax(140px,1fr)); gap: 6px 20px; flex: 1; }
  .banner .meta div { font-size: 12px; color: var(--muted-foreground); }
  .banner .meta b { display: block; color: var(--foreground); font-family: var(--font-mono); font-size: 13px; font-weight: 600; }

  .invocation { font-family: var(--font-mono); font-size: 12px; background: var(--muted); color: var(--foreground);
    padding: 8px 12px; border-radius: var(--radius); border: 1px solid var(--border); overflow-x: auto; white-space: pre; }

  .sectitle { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted-foreground); margin: 22px 0 8px; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .tablewrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; background: var(--card); }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted-foreground); background: var(--card-2); font-weight: 600; }
  tr:last-child td { border-bottom: none; }
  td.n, th.n { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  td.m { font-family: var(--font-mono); }

  .pill { display: inline-block; font-family: var(--font-mono); font-size: 10px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.04em; padding: 2px 8px; border-radius: 999px; border: 1px solid; }
  .pill.ok { color: var(--ok); border-color: var(--ok); background: var(--ok-bg); }
  .pill.bad { color: var(--bad); border-color: var(--bad); background: var(--bad-bg); }
  .pill.warn { color: var(--warn); border-color: var(--warn); background: var(--warn-bg); }
  .pill.info { color: var(--info); border-color: var(--info); background: var(--info-bg); }
  .pill.neutral { color: var(--neutral); border-color: var(--neutral); background: var(--neutral-bg); }
  .tag { font-family: var(--font-mono); font-size: 10px; color: var(--muted-foreground); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; margin-right: 4px; }

  .grouphead { display: flex; align-items: center; gap: 10px; margin: 26px 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
  .grouphead:first-child { margin-top: 6px; }
  .grouphead .grouptitle { font-weight: 650; font-size: 15px; }
  .grouphead .cnt { font-family: var(--font-mono); font-size: 11px; color: var(--muted-foreground); margin-left: auto; }
  .kindchip { font-family: var(--font-mono); font-size: 10px; font-weight: 650; text-transform: uppercase; letter-spacing: 0.05em; padding: 2px 8px; border-radius: 4px; border: 1px solid currentColor; }
  .kindchip.gherkin { color: var(--gherkin); }
  .kindchip.junit { color: var(--junit); }
  .feature .kindchip { margin-left: 8px; }

  .feature { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 10px; overflow: hidden; background: var(--card); }
  .feature > .fhead { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--card-2); }
  .feature .fhead .fname { font-weight: 600; }
  .scenario { border-top: 1px solid var(--border); }
  .srow { display: flex; align-items: center; gap: 10px; padding: 9px 14px; cursor: pointer; }
  .srow:hover { background: var(--muted); }
  .srow .sname { flex: 1; }
  .steps { padding: 4px 14px 12px 30px; font-size: 12.5px; }
  .step { display: flex; gap: 8px; padding: 3px 0; align-items: baseline; }
  .step .kw { font-family: var(--font-mono); font-weight: 600; min-width: 46px; color: var(--muted-foreground); }
  .step .stxt { flex: 1; }
  .step .sdur { font-family: var(--font-mono); font-size: 11px; color: var(--muted-foreground); }
  .failbox { margin: 6px 30px 12px; border: 1px solid var(--bad); background: var(--bad-bg); border-radius: 6px; padding: 10px 12px; }
  .failbox .fmsg { font-family: var(--font-mono); font-size: 12px; color: var(--foreground); white-space: pre-wrap; }
  .failbox .fpath { font-family: var(--font-mono); font-size: 11px; color: var(--muted-foreground); margin-top: 6px; }

  .toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted-foreground); cursor: pointer; user-select: none; }

  .timeline { position: relative; height: 64px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); margin: 6px 0 4px; }
  .tl-axis { position: absolute; left: 12px; right: 12px; top: 32px; height: 1px; background: var(--border); }
  .tl-mark { position: absolute; top: 22px; width: 12px; height: 12px; border-radius: 999px; transform: translateX(-6px); border: 2px solid var(--card); cursor: default; }
  .tl-label { position: absolute; bottom: 4px; font-family: var(--font-mono); font-size: 9px; color: var(--muted-foreground); transform: translateX(-50%); }

  .bar-row { display: grid; grid-template-columns: 150px 1fr 44px; align-items: center; gap: 10px; margin: 4px 0; font-size: 12px; }
  .bar-row .bl { font-family: var(--font-mono); color: var(--muted-foreground); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-track { background: var(--muted); border-radius: 4px; height: 14px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--primary); border-radius: 4px; }
  .bar-row .bv { font-family: var(--font-mono); text-align: right; font-variant-numeric: tabular-nums; }

  .kindbars .bar-row { grid-template-columns: 170px 1fr 30px; }
  .selectrow { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .selectrow button { cursor: pointer; font-size: 12px; padding: 6px 12px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--card); color: var(--foreground); font-family: var(--font-mono); }
  .selectrow button.active { border-color: var(--primary); color: var(--primary); }

  .empty { border: 1px dashed var(--border); border-radius: 8px; padding: 20px; text-align: center; color: var(--muted-foreground); font-size: 13px; }
  .drop-hint { position: fixed; inset: 0; background: color-mix(in oklab, var(--background) 82%, transparent); display: none; align-items: center; justify-content: center; z-index: 30; }
  .drop-hint .box { border: 2px dashed var(--primary); border-radius: 12px; padding: 40px 60px; font-size: 16px; color: var(--primary); background: var(--card); }
  body.dragging .drop-hint { display: flex; }
  .fullerr { margin: 40px auto; max-width: 560px; text-align: center; }
  .fullerr .pill { margin-bottom: 12px; }
  @media (max-width: 820px) {
    .app { grid-template-columns: 1fr; }
    aside { position: static; height: auto; flex-direction: column; }
  }
</style>
</head>
<body>

<div class="app" id="app">
  <aside>
    <div class="brand">
      <div class="kicker">Holmgang Validation Report</div>
      <h1>Gimlé Saga</h1>
    </div>
    <nav id="nav"></nav>
    <div class="sidefoot" id="sidefoot"></div>
  </aside>
  <main id="main"></main>
</div>
<div class="drop-hint"><div class="box">Drop holmgang-report.json to load</div></div>
<input type="file" id="fileinput" accept="application/json,.json" style="display:none">
<input type="file" id="baselineinput" accept="application/json,.json" style="display:none">

const SAMPLE_BASELINE = (() => {

  b.run.id = "holmgang-20260813-091500";
  b.run.outcome = "PASSED";

  b.run.finishedAt = "2026-08-13T09:25:40Z";
  b.run.durationMillis = 640000;
  b.run.environment.gitCommit = "1cfe315";
  b.scenarios.total = 17; b.scenarios.passed = 17; b.scenarios.failed = 0;
  for (const f of b.scenarios.features) if (f.file === "rolling-update.feature") {
    const s = f.scenarios[0];
    s.status = "PASSED"; s.durationMillis = 40120; s.failure = null;
    s.steps[2].status = "PASSED"; s.steps[2].durationMillis = 28800;
  }
  const sr = b.surtr.runs[0].measurements;
  sr.instanceStartupLatency.phases.submitToActive = { count: 10, p50: 7900, p95: 8200, p99: 8200, max: 8200 };
  sr.instanceStartupLatency.phases.startingToActive = { count: 10, p50: 44, p95: 70, p99: 70, max: 70 };
  sr.apiLatency[0].p99 = 41;
  const fr = b.fenrir.runs[0];
  fr.planned = 4; fr.executed = 4; fr.skipped = 0; fr.recovered = 4;
  fr.ledger[3] = { index: 4, kind: "STORE_BOUNCE", victim: "store-1", firedAtOffsetMillis: 59900, outcome: "RECOVERED", recoveryMillis: 10, skipReason: null };
  return b;

/* ============================================================
   Central store — the single source of truth. Components below
   are pure renderers reading from `store`; nothing fetches or
   caches report data on its own. A future live backend is a
   third branch in loadReport(), zero render changes.
   ============================================================ */
const store = {
  report: null,
  source: "sample",      // 'sample' | 'file' | 'url'
  status: "idle",        // 'idle' | 'loaded' | 'error'
  error: null,
  screen: "overview",
  theme: "dark",
  failedOnly: false,
  changesOnly: false,    // scenarios: show only status changes vs baseline
  selectedSurtr: 0,
  expanded: new Set(),
  baseline: null,        // the report compared against, or null
  baselineSource: null
};

const comparing = () => store.baseline != null;

const repository = {
  async load() {
    const url = new URLSearchParams(location.search).get("report");
    if (url) {
      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error("HTTP " + res.status);
        return { source: "url", data: await res.json() };
      } catch (e) {
        // Cross-origin fetches are blocked in the sandbox; fall back to the sample and let the
        // user drop a file. The mock IS a fixture of the same schema, so the UI is unaffected.
        return { source: "sample", data: SAMPLE, note: "could not fetch ?report= (" + e.message + ")" };
      }
    }
    return { source: "sample", data: SAMPLE };
  }
};

function validate(r) {
  if (!r || typeof r !== "object") return "report is not an object";
  if (r.schemaVersion !== 1) return "unsupported schemaVersion: " + r.schemaVersion;
  if (!r.run || !r.run.outcome) return "missing run.outcome";
  if (!r.scenarios || !Array.isArray(r.scenarios.features)) return "missing scenarios.features";
  return null;
}

function applyReport(data, source) {
  const err = validate(data);
  if (err) { store.status = "error"; store.error = err; store.report = null; }
  else { store.status = "loaded"; store.error = null; store.report = data; store.source = source; store.selectedSurtr = 0; store.expanded = new Set(); }
  render();
}

function applyBaseline(data, source) {
  const err = validate(data);
  if (err) { store.baselineError = "baseline: " + err; store.baseline = null; }
  else { store.baseline = data; store.baselineSource = source; store.baselineError = null; }
  render();
}
function clearBaseline() { store.baseline = null; store.baselineSource = null; store.changesOnly = false; render(); }

/* ---- comparison helpers ---- */
function pctDelta(cur, base) {
  if (base == null || base === 0) return null;
  return (cur - base) / base * 100;
}
// A colored "baseline → delta" annotation. lowerIsBetter: latency/failures (up = bad).
function deltaHtml(cur, base, lowerIsBetter, unit) {
  if (base == null) return `<span style="color:var(--muted-foreground)">new</span>`;
  const d = cur - base;
  if (d === 0) return `<span style="color:var(--muted-foreground)">±0</span>`;
  const worse = lowerIsBetter ? d > 0 : d < 0;
  const color = worse ? "var(--bad)" : "var(--ok)";
  const p = pctDelta(cur, base);
  const arrow = d > 0 ? "▲" : "▼";
  const pctStr = p == null ? "" : ` ${d > 0 ? "+" : ""}${Math.round(p)}%`;
  return `<span style="color:${color}" title="baseline ${base}${unit||""}">${arrow} ${d > 0 ? "+" : ""}${d}${unit||""}${pctStr}</span>`;
}
// Index a report's scenarios by "feature::name" -> {status, durationMillis}.
function scenarioIndex(report) {
  const idx = new Map();
  if (report && report.scenarios) for (const f of report.scenarios.features)
    for (const s of f.scenarios) idx.set(f.name + "::" + s.name, s);
  return idx;
}
// The change class of a current scenario vs its baseline counterpart.
function scenarioChange(cur, base) {
  if (!base) return { key: "new", label: "NEW", tone: "info" };
  if (base.status === cur.status) {
    if (cur.status === "FAILED") return { key: "stillfail", label: "STILL FAILING", tone: "warn" };
    return { key: "same", label: "", tone: "" };
  }
  if (base.status === "PASSED" && cur.status === "FAILED") return { key: "regressed", label: "NEW FAILURE", tone: "bad" };
  if (base.status === "FAILED" && cur.status === "PASSED") return { key: "fixed", label: "FIXED", tone: "ok" };
  return { key: "changed", label: base.status + "→" + cur.status, tone: "warn" };
}
function envMismatch() {
  if (!comparing()) return null;
  const a = (store.report.run || {}).environment || {}, b = (store.baseline.run || {}).environment || {};
  const diffs = [];
  for (const k of ["jdk", "os", "host", "surtrScaleFactor"])
    if (a[k] != null && b[k] != null && String(a[k]) !== String(b[k])) diffs.push(`${k}: ${b[k]} → ${a[k]}`);
  return diffs.length ? diffs : null;
}

/* ---------------- helpers ---------------- */
const el = (t, c, h) => { const n = document.createElement(t); if (c) n.className = c; if (h != null) n.innerHTML = h; return n; };
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, m => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;" }[m]));

function fmtDur(ms) {
  if (ms == null) return "-";
  if (ms < 10000) return ms + " ms";
  if (ms < 120000) return (ms / 1000).toFixed(1) + " s";
  const s = Math.round(ms / 1000);
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function statusPill(s) {
  const map = { PASSED:"ok", RECOVERED:"ok", FAILED:"bad", SKIPPED:"neutral", WARN:"warn", ABORTED:"warn" };
  return `<span class="pill ${map[s] || "info"}">${esc(s)}</span>`;
}

/* ---------------- render root ---------------- */
function render() {
  document.documentElement.className = store.theme === "light" ? "light" : "";
  renderNav();
  renderSidefoot();
  const main = document.getElementById("main");
  main.innerHTML = "";
  if (store.status === "error") { main.appendChild(renderError()); return; }
  const r = store.report;
  if (!r) { main.appendChild(el("div", "empty", "Loading…")); return; }
  if (store.screen === "overview") renderOverview(main, r);
  else if (store.screen === "scenarios") renderScenarios(main, r);
  else if (store.screen === "fenrir") renderFenrir(main, r);
  else if (store.screen === "surtr") renderSurtr(main, r);
}

function renderError() {
  const box = el("div", "fullerr");
  box.innerHTML = `<div class="pill bad">Invalid report</div>
    <h2>This file isn't a Holmgang report</h2>
    <p style="color:var(--muted-foreground)">${esc(store.error)}</p>
    <p style="color:var(--muted-foreground)">Expected a <span class="mono">holmgang-report.json</span> with <span class="mono">schemaVersion: 1</span>. Drop a valid file to try again.</p>`;
  return box;
}

function navCounts(r) {
  return {
    overview: "",
    scenarios: r.scenarios ? `${r.scenarios.passed}/${r.scenarios.total}` : "",
    fenrir: r.fenrir && r.fenrir.runs ? String(r.fenrir.runs.reduce((a, x) => a + x.executed, 0)) : "off",
    surtr: r.surtr && r.surtr.runs ? String(r.surtr.runs.length) : "off"
  };
}
function renderNav() {
  const nav = document.getElementById("nav");
  nav.innerHTML = "";
  const r = store.report;
  const counts = r ? navCounts(r) : {};
  const items = [
    { id: "overview", label: "Overview", on: true },
    { id: "scenarios", label: "Scenarios", on: !!r },
    { id: "fenrir", label: "Fenrir", on: !!(r && r.fenrir && r.fenrir.runs && r.fenrir.runs.length) },
    { id: "surtr", label: "Surtr", on: !!(r && r.surtr && r.surtr.runs && r.surtr.runs.length) }
  ];
  for (const it of items) {
    const node = el("div", "navitem" + (store.screen === it.id ? " active" : "") + (it.on ? "" : " disabled"));
    node.innerHTML = `<span>${it.label}</span><span class="cnt">${it.on ? (counts[it.id] || "") : "not in this run"}</span>`;
    if (it.on) node.onclick = () => { store.screen = it.id; render(); };
    nav.appendChild(node);
  }
}
function renderSidefoot() {
  const foot = document.getElementById("sidefoot");
  const r = store.report;
  const outcome = r && r.run ? r.run.outcome : null;
  const dotColor = outcome === "PASSED" ? "var(--ok)" : outcome === "FAILED" ? "var(--bad)" : "var(--warn)";
  let html = "";
  if (store.source === "sample") html += `<div class="sourcechip">● Sample data</div>`;
  else html += `<div class="mono" style="font-size:11px;color:var(--muted-foreground)">${esc(store.source)} · loaded</div>`;
  if (r && r.run) html += `<div style="margin-top:10px;display:flex;align-items:center;gap:8px;font-size:12px">
      <span class="outcome-dot" style="background:${dotColor}"></span>
      <span class="mono" style="color:var(--muted-foreground)">${esc(r.run.id || "")}</span></div>`;

  if (comparing()) {
    html += `<div style="margin-top:10px;padding:8px 10px;border:1px solid var(--primary);border-radius:var(--radius);background:var(--card)">
        <div class="kicker" style="color:var(--primary)">Comparing vs baseline</div>
        <div class="mono" style="font-size:11px;color:var(--muted-foreground);margin-top:3px">${esc((store.baseline.run||{}).id||"baseline")}</div>
        <div style="display:flex;gap:6px;margin-top:6px">
          <button class="themebtn" id="rebasebtn" style="margin:0;flex:1">Change…</button>
          <button class="themebtn" id="clearbasebtn" style="margin:0;flex:1">Clear</button>
        </div>
      </div>`;
  } else {
    if (store.baselineError) html += `<div class="mono" style="font-size:11px;color:var(--bad);margin-top:8px">${esc(store.baselineError)}</div>`;
  }

  html += `<button class="filebtn" id="loadbtn">Load report file…</button>`;
  if (!comparing()) html += `<button class="themebtn" id="basebtn">Compare to baseline…</button>`;
  if (!comparing() && store.source === "sample") html += `<button class="themebtn" id="samplebasebtn" style="border-color:var(--primary);color:var(--primary)">▷ Try sample comparison</button>`;
  html += `<button class="themebtn" id="themebtn">${store.theme === "light" ? "◐ Dark panel" : "◑ Light paper"}</button>`;
  foot.innerHTML = html;
  document.getElementById("loadbtn").onclick = () => document.getElementById("fileinput").click();
  document.getElementById("themebtn").onclick = () => { store.theme = store.theme === "light" ? "dark" : "light"; render(); };
  const baseBtn = document.getElementById("basebtn"); if (baseBtn) baseBtn.onclick = () => document.getElementById("baselineinput").click();
  const sampleBase = document.getElementById("samplebasebtn"); if (sampleBase) sampleBase.onclick = () => applyBaseline(SAMPLE_BASELINE, "sample-baseline");
  const rebase = document.getElementById("rebasebtn"); if (rebase) rebase.onclick = () => document.getElementById("baselineinput").click();
  const clearb = document.getElementById("clearbasebtn"); if (clearb) clearb.onclick = clearBaseline;
}

/* ---------------- Overview ---------------- */
function renderOverview(main, r) {
  main.appendChild(headEl("Overview", r.run.id));
  const okv = r.run.outcome === "PASSED";
  const banner = el("div", "banner");
  banner.innerHTML =
    `<div class="verdict ${okv ? "ok" : "bad"}">${esc(r.run.outcome)}</div>
     <div class="meta">
       <div>Duration<b class="num">${fmtDur(r.run.durationMillis)}</b></div>
       <div>Started<b>${esc((r.run.startedAt||"").replace("T"," ").replace("Z"," UTC"))}</b></div>
       <div>Finished<b>${esc((r.run.finishedAt||"").replace("T"," ").replace("Z"," UTC"))}</b></div>
       <div>Commit<b>${esc(r.run.environment && r.run.environment.gitCommit || "-")}</b></div>
     </div>`;
  main.appendChild(banner);

  if (comparing()) main.appendChild(overviewCompareStrip(r, store.baseline));

  main.appendChild(el("div", "invocation", esc(r.run.invocation || "")));

  const sc = r.scenarios || { passed:0, failed:0, skipped:0 };
  const fen = (r.fenrir && r.fenrir.runs) || [];
  const fenExec = fen.reduce((a,x)=>a+x.executed,0), fenRec = fen.reduce((a,x)=>a+x.recovered,0);
  const sur = (r.surtr && r.surtr.runs) || [];
  const surGates = sur.reduce((a,x)=>a+(x.gates||[]).length,0), surPass = sur.reduce((a,x)=>a+(x.gates||[]).filter(g=>g.passed).length,0);
  const tiles = el("div", "grid tiles");
  tiles.appendChild(tile("Scenarios", `${sc.passed}<small> / ${sc.total} passed</small>`, sc.failed ? "bad" : "ok"));
  tiles.appendChild(tile("Failed", String(sc.failed), sc.failed ? "bad" : "muted"));
  tiles.appendChild(tile("Fenrir faults", `${fenRec}<small> / ${fenExec} recovered</small>`));
  tiles.appendChild(tile("Surtr gates", `${surPass}<small> / ${surGates} passed</small>`));
  main.appendChild(tiles);

  const env = r.run.environment || {};
  main.appendChild(sec("Environment"));
  const envcard = el("div", "card grid tiles");
  [["JDK", env.jdk],["OS", env.os],["Host", env.host],["Chaos seed", env.chaosSeed],["Surtr scale", env.surtrScaleFactor]]
    .forEach(([k,v]) => { if (v != null && v !== "") envcard.appendChild(tile(k, `<span style="font-size:16px">${esc(v)}</span>`)); });
  main.appendChild(envcard);

  if (r.topologies && r.topologies.length) {
    main.appendChild(sec("Topologies booted"));
    main.appendChild(tableEl(
      ["Name","Transport","Stores","CP","Fafnir","Muninn","Nodes","Proxied"],
      r.topologies.map(t => [
        `<span class="m">${esc(t.name)}</span>`,
        `<span class="pill ${t.transport==="MTLS"?"info":"neutral"}">${esc(t.transport)}</span>`,
        {n:t.stores},{n:t.controlPlanes},{n:t.fafnirs},
        t.muninn?`<span class="pill ok">on</span>`:`<span class="pill neutral">off</span>`,
        {n:t.nodes},
        t.faultsProxied?"yes":"no"
      ])));
  }
}

/* ---------------- Scenarios ---------------- */
function renderScenarios(main, r) {
  main.appendChild(headEl("Scenarios", `${r.scenarios.passed} passed · ${r.scenarios.failed} failed · ${r.scenarios.skipped} skipped`));
  const baseIdx = comparing() ? scenarioIndex(store.baseline) : null;
  const toolbar = el("div", "toolbar");
  const t = el("label", "toggle");
  t.innerHTML = `<input type="checkbox" ${store.failedOnly?"checked":""}> Failed only`;
  t.querySelector("input").onchange = e => { store.failedOnly = e.target.checked; render(); };
  toolbar.appendChild(t);
  if (comparing()) {
    const ct = el("label", "toggle");
    ct.innerHTML = `<input type="checkbox" ${store.changesOnly?"checked":""}> Changes only`;
    ct.querySelector("input").onchange = e => { store.changesOnly = e.target.checked; render(); };
    toolbar.appendChild(ct);
  }
  main.appendChild(toolbar);

  // Separate the two test kinds: Gherkin features carry a ".feature" file, JUnit ITs a class name.
  const gherkin = r.scenarios.features.filter(isGherkinFeature);
  const junit = r.scenarios.features.filter(f => !isGherkinFeature(f));
  renderFeatureGroup(main, "gherkin", "Behavioural scenarios (Gherkin)", "feature", "scenario", gherkin, baseIdx);
  renderFeatureGroup(main, "junit", "Integration tests (JUnit)", "class", "test", junit, baseIdx);

  if (!main.querySelector(".feature")) {
    main.appendChild(el("div", "empty", "No tests match the current filter."));
  }
}

function isGherkinFeature(f) {
  return (f.file || "").endsWith(".feature");
}

function renderFeatureGroup(main, kind, title, unit, itemNoun, features, baseIdx) {
  if (!features.length) return;
  const nodes = [];
  let totalItems = 0;
  for (const f of features) {
    totalItems += f.scenarios.length;
    const node = renderFeatureNode(f, kind, baseIdx);
    if (node) nodes.push(node);
  }
  if (!nodes.length) return; // whole group filtered away
  const header = el("div", "grouphead");
  header.innerHTML =
    `<span class="kindchip ${kind}">${kind === "gherkin" ? "Gherkin" : "JUnit"}</span>
     <span class="grouptitle">${esc(title)}</span>
     <span class="cnt">${features.length} ${unit}${features.length === 1 ? "" : "es"} · ${totalItems} ${itemNoun}${totalItems === 1 ? "" : "s"}</span>`;
  main.appendChild(header);
  nodes.forEach(n => main.appendChild(n));
}

/** Builds one feature/class card, or null when the filters hide all its scenarios. */
function renderFeatureNode(f, kind, baseIdx) {
  let scenarios = store.failedOnly ? f.scenarios.filter(s => s.status === "FAILED") : f.scenarios;
  if (baseIdx && store.changesOnly)
    scenarios = scenarios.filter(s => scenarioChange(s, baseIdx.get(f.name + "::" + s.name)).key !== "same");
  if (!scenarios.length) return null;
  const passed = f.scenarios.filter(s => s.status === "PASSED").length;
  const failed = f.scenarios.filter(s => s.status === "FAILED").length;
  const feat = el("div", "feature");
  const fhead = el("div", "fhead");
  fhead.innerHTML = `<span class="fname">${esc(f.name)}</span>
    <span class="kindchip ${kind}">${kind === "gherkin" ? "Gherkin" : "JUnit"}</span>
    <span class="mono" style="font-size:11px;color:var(--muted-foreground)">${esc(f.file || "")}</span>
    <span style="flex:1"></span>
    <span class="pill ${failed ? "bad" : "ok"}">${passed}/${f.scenarios.length}</span>`;
  feat.appendChild(fhead);
  scenarios.forEach(s => {
    const key = f.name + "::" + s.name;
    const open = store.expanded.has(key);
    const scn = el("div", "scenario");
    const row = el("div", "srow");
    const baseS = baseIdx ? baseIdx.get(f.name + "::" + s.name) : null;
    const change = baseIdx ? scenarioChange(s, baseS) : null;
    const changeBadge = change && change.label ? `<span class="pill ${change.tone}">${esc(change.label)}</span>` : "";
    const durDelta = baseS ? `<span class="num" style="font-size:10px;margin-left:4px">${deltaHtml(s.durationMillis, baseS.durationMillis, true, "")}</span>` : "";
    const stepChevron = (s.steps || []).length ? (open ? "▾" : "▸") : "·";
    row.innerHTML = `<span style="color:var(--muted-foreground);font-family:var(--font-mono);font-size:11px">${stepChevron}</span>
      <span class="sname">${esc(s.name)}</span>
      ${(s.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join("")}
      ${s.topology ? `<span class="tag">${esc(s.topology)}</span>` : ""}
      <span class="num" style="font-size:11px;color:var(--muted-foreground)">${fmtDur(s.durationMillis)}</span>${durDelta}
      ${changeBadge}
      ${statusPill(s.status)}`;
    row.onclick = () => { open ? store.expanded.delete(key) : store.expanded.add(key); render(); };
    scn.appendChild(row);
    if (open) {
      const steps = el("div", "steps");
      (s.steps || []).forEach(st => {
        const dotc = st.status === "PASSED" ? "var(--ok)" : st.status === "FAILED" ? "var(--bad)" : "var(--neutral)";
        const stp = el("div", "step");
        stp.innerHTML = `<span class="kw">${esc(st.keyword)}</span>
          <span class="stxt"><span class="outcome-dot" style="background:${dotc};margin-right:6px"></span>${esc(st.text)}</span>
          <span class="sdur num">${fmtDur(st.durationMillis)}</span>`;
        steps.appendChild(stp);
      });
      if (!(s.steps || []).length) {
        steps.appendChild(el("div", "step", `<span style="color:var(--muted-foreground)">No steps — a JUnit @Test asserts directly, no Gherkin breakdown.</span>`));
      }
      scn.appendChild(steps);
      if (s.failure) {
        const fb = el("div", "failbox");
        fb.innerHTML = `<div class="fmsg">${esc(s.failure.message)}</div>` +
          (s.failure.forensicReportPath ? `<div class="fpath">forensic report: ${esc(s.failure.forensicReportPath)}</div>` : "");
        scn.appendChild(fb);
      }
    }
    feat.appendChild(scn);
  });
  return feat;
}

/* ---------------- Fenrir ---------------- */
function renderFenrir(main, r) {
  main.appendChild(headEl("Fenrir", "Randomized chaos soak"));
  for (const run of r.fenrir.runs) {
    main.appendChild(el("h3", null, esc(run.scenario)).cloneNode(true));
    const baseFen = baselineFenrirRun(run.scenario);
    const withBase = (val, baseVal) => baseFen ? `${val} <small style="color:var(--muted-foreground)">(${deltaHtml(val, baseVal, false, "")})</small>` : String(val);
    const tiles = el("div", "grid tiles");
    tiles.appendChild(tile("Seed", `<span class="mono" style="font-size:15px">${esc(run.seed)}</span>`));
    tiles.appendChild(tile("Soak", fmtDur(run.soakMillis)));
    tiles.appendChild(tile("Planned", String(run.planned)));
    tiles.appendChild(tile("Executed", baseFen ? withBase(run.executed, baseFen.executed) : String(run.executed)));
    tiles.appendChild(tile("Skipped", String(run.skipped), run.skipped?"warn":"muted"));
    tiles.appendChild(tile("Recovered", baseFen ? withBase(run.recovered, baseFen.recovered) : `${run.recovered}`, run.recovered===run.executed?"ok":"bad"));
    main.appendChild(tiles);

    // Strike timeline
    main.appendChild(sec("Strike timeline"));
    const tl = el("div", "timeline");
    tl.appendChild(el("div", "tl-axis"));
    const span = run.soakMillis || 1;
    for (const e of run.ledger) {
      const x = 12 + (e.firedAtOffsetMillis / span) * (100 - 2);
      const color = e.outcome==="RECOVERED"?"var(--ok)":e.outcome==="SKIPPED"?"var(--neutral)":"var(--bad)";
      const m = el("div", "tl-mark");
      m.style.left = `calc(${x}% )`;
      m.style.background = color;
      m.title = `#${e.index} ${e.kind} @ ${Math.round(e.firedAtOffsetMillis/1000)}s — ${e.outcome}` +
        (e.victim?` (${e.victim})`:"") + (e.recoveryMillis!=null?` in ${e.recoveryMillis}ms`:"") + (e.skipReason?` — ${e.skipReason}`:"");
      tl.appendChild(m);
      const lbl = el("div", "tl-label", "#" + e.index);
      lbl.style.left = `calc(${x}% )`;
      tl.appendChild(lbl);
    }
    main.appendChild(tl);

    // Ledger table
    main.appendChild(sec("Ledger"));
    main.appendChild(tableEl(
      ["#","Fault","Victim","Fired at","Outcome","Recovery","Skip reason"],
      run.ledger.map(e => [
        {n:e.index},
        `<span class="m">${esc(e.kind)}</span>`,
        e.victim?`<span class="m">${esc(e.victim)}</span>`:`<span style="color:var(--muted-foreground)">—</span>`,
        {n:Math.round(e.firedAtOffsetMillis/1000)+"s"},
        statusPill(e.outcome),
        {n:e.recoveryMillis!=null?e.recoveryMillis+" ms":"—"},
        e.skipReason?`<span style="color:var(--warn)">${esc(e.skipReason)}</span>`:""
      ])));

    // Per-kind counts
    const byKind = {};
    run.ledger.forEach(e => { if (e.outcome !== "SKIPPED") byKind[e.kind] = (byKind[e.kind]||0)+1; });
    const maxK = Math.max(1, ...Object.values(byKind));
    main.appendChild(sec("Executed by fault kind"));
    const kb = el("div", "kindbars card");
    Object.entries(byKind).forEach(([k,v]) => kb.appendChild(barRow(k, v, maxK)));
    if (!Object.keys(byKind).length) kb.appendChild(el("div","empty","no faults executed"));
    main.appendChild(kb);
  }
}

/* ---------------- Surtr ---------------- */
function renderSurtr(main, r) {
  main.appendChild(headEl("Surtr", "Scale & performance burn"));
  const runs = r.surtr.runs;
  if (runs.length > 1) {
    const sel = el("div", "selectrow");
    runs.forEach((run, i) => {
      const b = el("button", i===store.selectedSurtr?"active":"", esc(run.workload));
      b.onclick = () => { store.selectedSurtr = i; render(); };
      sel.appendChild(b);
    });
    main.appendChild(sel);
  }
  const run = runs[Math.min(store.selectedSurtr, runs.length-1)];
  const baseRun = baselineSurtrRun(run.workload);
  const cmp = comparing() && baseRun;

  if (comparing() && !baseRun) main.appendChild(el("div", "empty", "No '" + esc(run.workload) + "' run in the baseline to compare against."));

  const head = el("div", "banner");
  head.innerHTML = `<div class="verdict ${run.outcome==="PASSED"?"ok":"bad"}" style="font-size:22px">${esc(run.outcome)}</div>
    <div class="meta">
      <div>Workload<b>${esc(run.workload)}</b></div>
      <div>Topology<b>${esc(run.topology)}</b></div>
      <div>Scale factor<b class="num">${esc(run.scaleFactor)}×</b></div>
    </div>`;
  main.appendChild(head);

  main.appendChild(sec("Jobs"));
  main.appendChild(tableEl(
    ["Name","Type","Iterations","Wall time","Submitted","Active","Failed"],
    run.jobs.map(j => [
      `<span class="m">${esc(j.name)}</span>`,
      `<span class="pill neutral">${esc(j.type)}</span>`,
      {n:j.iterations},{n:fmtDur(j.wallMillis)},{n:j.submitted},{n:j.active!=null?j.active:"—"},
      {n:j.failed, cls: j.failed?"bad":""}
    ])));

  const m = run.measurements || {};
  if (m.instanceStartupLatency && m.instanceStartupLatency.phases) {
    main.appendChild(sec("Instance startup latency (from the platform event log)"));
    const basePhases = cmp && baseRun.measurements.instanceStartupLatency ? baseRun.measurements.instanceStartupLatency.phases : {};
    const headers = ["Phase","p50","p95","p99","max","n"];
    if (cmp) headers.push("Δ p99");
    main.appendChild(tableEl(headers,
      Object.entries(m.instanceStartupLatency.phases).map(([ph,p]) => {
        const cells = [`<span class="m">${esc(ph)}</span>`,{n:p.p50+" ms"},{n:p.p95+" ms"},{n:p.p99+" ms"},{n:p.max+" ms"},{n:p.count}];
        if (cmp) cells.push(basePhases[ph] ? deltaHtml(p.p99, basePhases[ph].p99, true, " ms") : `<span style="color:var(--muted-foreground)">new</span>`);
        return cells;
      })));
  }
  if (m.apiLatency && m.apiLatency.length) {
    main.appendChild(sec("API latency (client-observed)"));
    const baseApi = {};
    if (cmp && baseRun.measurements.apiLatency) baseRun.measurements.apiLatency.forEach(a => baseApi[a.verb + " " + a.endpoint] = a);
    const headers = ["Endpoint","Verb","Count","Errors","p50","p95","p99","max"];
    if (cmp) headers.push("Δ p99");
    main.appendChild(tableEl(headers,
      m.apiLatency.map(a => {
        const cells = [`<span class="m">${esc(a.endpoint)}</span>`,`<span class="m">${esc(a.verb)}</span>`,
          {n:a.count},{n:a.errorCount, cls:a.errorCount?"bad":""},{n:a.p50+" ms"},{n:a.p95+" ms"},{n:a.p99+" ms"},{n:a.max+" ms"}];
        if (cmp) { const b = baseApi[a.verb + " " + a.endpoint]; cells.push(b ? deltaHtml(a.p99, b.p99, true, " ms") : `<span style="color:var(--muted-foreground)">new</span>`); }
        return cells;
      })));
  }
  if (m.placementSpread) {
    main.appendChild(sec("Placement spread"));
    const wrap = el("div", "grid");
    wrap.style.gridTemplateColumns = "1fr 1fr";
    wrap.appendChild(spreadCard("Per node", m.placementSpread.instancesPerNode));
    wrap.appendChild(spreadCard("Per worker JVM", m.placementSpread.instancesPerWorker));
    main.appendChild(wrap);
  }
  if (m.muninnWindow && m.muninnWindow.length) {
    main.appendChild(sec("Muninn metric series"));
    m.muninnWindow.forEach(sv => {
      if (sv.skippedReason) {
        const c = el("div", "empty");
        c.innerHTML = `<b class="mono">${esc(sv.metric)}</b> — skipped<br><span style="font-size:12px">${esc(sv.skippedReason)}</span>`;
        main.appendChild(c);
      } else {
        main.appendChild(seriesChart(sv));
      }
    });
  }
  if (run.gates && run.gates.length) {
    main.appendChild(sec("Gates"));
    const baseGates = {};
    if (cmp && baseRun.gates) baseRun.gates.forEach(g => baseGates[g.name] = g);
    const headers = ["Gate","Threshold","Observed","Outcome"];
    if (cmp) headers.push("Δ observed");
    main.appendChild(tableEl(headers,
      run.gates.map(g => {
        const cells = [`<span class="m">${esc(g.name)}</span>`,{n:g.threshold},{n:g.observed},
          g.passed?`<span class="pill ok">PASS</span>`:`<span class="pill bad">FAIL</span>`];
        if (cmp) { const b = baseGates[g.name]; cells.push(b ? deltaHtml(g.observed, b.observed, true, "") : `<span style="color:var(--muted-foreground)">new</span>`); }
        return cells;
      })));
  }
}

/* ---------------- comparison builders ---------------- */
function overviewCompareStrip(cur, base) {
  const baseIdx = scenarioIndex(base);
  let newFail = 0, fixed = 0, stillFail = 0, added = 0;
  for (const f of cur.scenarios.features) for (const s of f.scenarios) {
    const ch = scenarioChange(s, baseIdx.get(f.name + "::" + s.name));
    if (ch.key === "regressed") newFail++;
    else if (ch.key === "fixed") fixed++;
    else if (ch.key === "stillfail") stillFail++;
    else if (ch.key === "new") added++;
  }
  const strip = el("div", "card");
  strip.style.borderColor = newFail ? "var(--bad)" : "var(--primary)";
  const bo = (base.run || {}).outcome, co = (cur.run || {}).outcome;
  let html = `<div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
      <div class="kicker" style="color:var(--primary)">Run comparison</div>
      <div class="mono" style="font-size:13px">${statusPill(bo)} <span style="color:var(--muted-foreground)">${esc((base.run||{}).id||"baseline")}</span>
        <span style="margin:0 8px;color:var(--muted-foreground)">→</span> ${statusPill(co)} <span style="color:var(--muted-foreground)">${esc((cur.run||{}).id||"current")}</span></div>
    </div>
    <div style="display:flex;gap:18px;flex-wrap:wrap;margin-top:12px;font-size:13px">
      ${cmpStat("New failures", newFail, newFail ? "bad" : "muted")}
      ${cmpStat("Fixed", fixed, fixed ? "ok" : "muted")}
      ${cmpStat("Still failing", stillFail, stillFail ? "warn" : "muted")}
      ${cmpStat("New scenarios", added, added ? "info" : "muted")}
    </div>`;
  const mism = envMismatch();
  if (mism) html += `<div style="margin-top:12px;padding:8px 10px;border-radius:var(--radius);border:1px solid var(--warn);background:var(--warn-bg);font-size:12px;color:var(--warn)">
      ⚠ Environments differ — compare with care: ${mism.map(esc).join(" · ")}</div>`;
  strip.innerHTML = html;
  return strip;
}
function cmpStat(label, val, tone) {
  const color = tone === "bad" ? "var(--bad)" : tone === "ok" ? "var(--ok)" : tone === "warn" ? "var(--warn)" : tone === "info" ? "var(--info)" : "var(--muted-foreground)";
  return `<div><div class="kicker">${esc(label)}</div><div class="num" style="font-size:22px;font-weight:600;color:${color}">${val}</div></div>`;
}
// Match the current Surtr run's counterpart in the baseline by workload name.
function baselineSurtrRun(workload) {
  if (!comparing() || !store.baseline.surtr) return null;
  return (store.baseline.surtr.runs || []).find(r => r.workload === workload) || null;
}
// Match the baseline Fenrir run by scenario name (falls back to first).
function baselineFenrirRun(scenario) {
  if (!comparing() || !store.baseline.fenrir) return null;
  const runs = store.baseline.fenrir.runs || [];
  return runs.find(r => r.scenario === scenario) || runs[0] || null;
}

/* ---------------- shared builders ---------------- */
function headEl(title, sub) {
  const h = el("div", "screen-head");
  h.innerHTML = `<h2>${esc(title)}</h2><span class="sub">${esc(sub||"")}</span>`;
  return h;
}
function sec(t) { return el("div", "sectitle", esc(t)); }
function tile(label, valHtml, tone) {
  const t = el("div", "card tile");
  const color = tone==="bad"?"color:var(--bad)":tone==="ok"?"color:var(--ok)":tone==="warn"?"color:var(--warn)":"";
  t.innerHTML = `<div class="label">${esc(label)}</div><div class="val" style="${color}">${valHtml}</div>`;
  return t;
}
function tableEl(headers, rows) {
  const wrap = el("div", "tablewrap");
  const table = el("table");
  const thead = el("thead");
  thead.innerHTML = "<tr>" + headers.map((h,i) => `<th class="${i>=2?"n":""}">${esc(h)}</th>`).join("") + "</tr>";
  // first two columns left-aligned, rest numeric-right by default; cells can override.
  const tbody = el("tbody");
  for (const row of rows) {
    const tr = el("tr");
    row.forEach((cell, i) => {
      if (cell && typeof cell === "object" && "n" in cell) {
        const td = el("td", "n" + (cell.cls?(" "+cell.cls):""));
        if (cell.cls==="bad") td.style.color = "var(--bad)";
        td.innerHTML = esc(cell.n);
        tr.appendChild(td);
      } else {
        const td = el("td", i>=2?"n":"");
        td.innerHTML = (cell==null?"":cell);
        tr.appendChild(td);
      }
    });
    tbody.appendChild(tr);
  }
  table.appendChild(thead); table.appendChild(tbody); wrap.appendChild(table);
  return wrap;
}
function barRow(label, value, max) {
  const row = el("div", "bar-row");
  const pct = Math.max(3, (value / max) * 100);
  row.innerHTML = `<div class="bl" title="${esc(label)}">${esc(label)}</div>
    <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
    <div class="bv">${esc(value)}</div>`;
  return row;
}
function spreadCard(title, items) {
  const c = el("div", "card");
  c.appendChild(el("div", "sectitle", esc(title)));
  const max = Math.max(1, ...(items||[]).map(x => x.instances));
  (items||[]).forEach(x => c.appendChild(barRow(x.id, x.instances, max)));
  if (!items || !items.length) c.appendChild(el("div","empty","no data"));
  return c;
}
function seriesChart(sv) {
  const c = el("div", "card");
  c.innerHTML = `<div class="sectitle">${esc(sv.metric)} <span style="text-transform:none">(${esc(sv.unit||"")})</span></div>`;
  const pts = sv.series || [];
  if (!pts.length) { c.appendChild(el("div","empty","no points")); return c; }
  const w = 640, h = 120, pad = 24;
  const vals = pts.map(p => p.value);
  const min = Math.min(...vals), max = Math.max(...vals), range = (max-min)||1;
  const step = pts.length>1 ? (w-2*pad)/(pts.length-1) : 0;
  const path = pts.map((p,i) => `${pad+i*step},${h-pad-((p.value-min)/range)*(h-2*pad)}`).join(" ");
  c.innerHTML += `<svg viewBox="0 0 ${w} ${h}" width="100%" preserveAspectRatio="none" style="max-height:140px">
    <polyline fill="none" stroke="var(--primary)" stroke-width="2" points="${path}"/>
    <circle cx="${pad+(pts.length-1)*step}" cy="${h-pad-((pts[pts.length-1].value-min)/range)*(h-2*pad)}" r="3" fill="var(--signal)"/>
  </svg>`;
  return c;
}

/* ---------------- file loading + drag/drop ---------------- */
document.getElementById("fileinput").addEventListener("change", e => {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = () => { try { applyReport(JSON.parse(reader.result), "file"); } catch (err) { store.status="error"; store.error="not valid JSON: "+err.message; render(); } };
  reader.readAsText(file);
  e.target.value = "";
});
document.getElementById("baselineinput").addEventListener("change", e => {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = () => { try { applyBaseline(JSON.parse(reader.result), "file"); } catch (err) { store.baselineError = "baseline: not valid JSON"; render(); } };
  reader.readAsText(file);
  e.target.value = "";
});
["dragenter","dragover"].forEach(ev => document.addEventListener(ev, e => { e.preventDefault(); document.body.classList.add("dragging"); }));
["dragleave","drop"].forEach(ev => document.addEventListener(ev, e => { e.preventDefault(); if (ev!=="dragleave" || e.relatedTarget===null) document.body.classList.remove("dragging"); }));
document.addEventListener("drop", e => {
  e.preventDefault(); document.body.classList.remove("dragging");
  const file = e.dataTransfer.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = () => { try { applyReport(JSON.parse(reader.result), "file"); } catch (err) { store.status="error"; store.error="not valid JSON: "+err.message; render(); } };
  reader.readAsText(file);
});

/* ---------------- boot ---------------- */
// The embedded run report wins when SagaWriter injected one; otherwise ?report= then sample.
(() => {
  const embeddedEl = document.getElementById("saga-embedded-report");
  const text = embeddedEl ? embeddedEl.textContent.trim() : "";
  if (text && !text.startsWith("__SAGA_REPORT_JSON")) {
    try {
      applyReport(JSON.parse(text), "this run");
      return;
    } catch (e) {
      // A corrupt embed falls through to the repository path rather than a blank page.
    }
  }
  repository.load().then(res => applyReport(res.data, res.source));
})();
