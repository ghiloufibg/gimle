# The bundled-JRE scenario: store/muninn/andvari/fafnir/controlplane run on a bare debian-slim base
# image with no JRE of their own at all -- they launch entirely off the jre/<component>/bin/java
# that gimle-dist's dist-with-jre profile bundled into the archive (see topology-bundled-jre.yaml's
# own runtime.useBundledJre: true). agent keeps a real eclipse-temurin:25-jre image, matching
# LaunchPlanner.planAgents' structural exclusion from useBundledJre -- agent spawns arbitrary vessel
# workloads and the worker JVMs it supervises host arbitrary Gimle modules, neither of which jlink's
# own derivation ever saw, so neither can safely run on a trimmed JRE (see
# gimle-docs/docs/reference/hilmir-reference.md).
#
# debian:bookworm-slim, not an Alpine base -- jlink's own runtime image links against glibc, which
# Alpine's musl libc cannot load.
#
# Prerequisite (see ../README.md#docker-compose-manual-validation): build the archive WITH
# dist-with-jre -- nothing else. GIMLE_DIST_TARGET already defaults to the reactor's own
# gimle-dist/target/, and the "unpack" service below extracts whichever
# gimle-platform-<version>.tar.gz it finds there into a shared volume before any other service
# starts, so there is no tarball path or version to type --
#   mvn -pl gimle-dist -am install -P dist-with-jre
#   docker compose -f docker-compose.bundled-jre.yml up

x-gimle-light-service: &gimle-light-service
  image: debian:bookworm-slim
  networks: [gimle]
  # Sanitizes entrypoint.sh into /tmp before running it, rather than executing the bind-mounted
  # file directly: a script checked out on Windows with CRLF line endings (a contributor's own
  # core.autocrlf, or a working tree from before .gitattributes normalized this repo) breaks
  # outright under /bin/sh regardless of what .gitattributes now says, since that only governs
  # future checkouts. This makes the container robust to the host's checkout state instead of
  # depending on it. "$@" carries the machine name from this service's own "command:" through.
  entrypoint: ["/bin/sh", "-c", 'tr -d "\r" < /holmgang/entrypoint.sh > /tmp/entrypoint.sh && exec /bin/sh /tmp/entrypoint.sh "$$@"', "--"]
  depends_on:
    unpack:
      condition: service_completed_successfully

services:
  unpack:
    image: debian:bookworm-slim
    networks: [gimle]
    entrypoint: ["/bin/sh", "-c", 'tr -d "\r" < /holmgang/unpack.sh > /tmp/unpack.sh && exec /bin/sh /tmp/unpack.sh']
    volumes:
      - ${GIMLE_DIST_TARGET:-../../gimle-dist/target}:/dist:ro
      - ./unpack.sh:/holmgang/unpack.sh:ro
      - gimle-install:/opt/gimle

  store:
    <<: *gimle-light-service
    command: ["store"]
    volumes:
      - gimle-install:/opt/gimle:ro
      - ./topology-bundled-jre.yaml:/config/topology.yaml:ro
      - ./entrypoint.sh:/holmgang/entrypoint.sh:ro
      - store-data:/data

  muninn:
    <<: *gimle-light-service
    command: ["muninn"]
    volumes:
      - gimle-install:/opt/gimle:ro
      - ./topology-bundled-jre.yaml:/config/topology.yaml:ro
      - ./entrypoint.sh:/holmgang/entrypoint.sh:ro
      - muninn-data:/data

  andvari:
    <<: *gimle-light-service
    command: ["andvari"]
    volumes:
      - gimle-install:/opt/gimle:ro
      - ./topology-bundled-jre.yaml:/config/topology.yaml:ro
      - ./entrypoint.sh:/holmgang/entrypoint.sh:ro
      - andvari-data:/data
    # AndvariServer serves both its /artifacts/* API and its bundled web console at /console on
    # this same port (TopologyParser's DEFAULT_ANDVARI_PORT, unoverridden by topology-bundled-jre.yaml).
    ports:
      - "9094:9094"

  fafnir:
    <<: *gimle-light-service
    command: ["fafnir"]
    volumes:
      - gimle-install:/opt/gimle:ro
      - ./topology-bundled-jre.yaml:/config/topology.yaml:ro
      - ./entrypoint.sh:/holmgang/entrypoint.sh:ro
      - fafnir-data:/data
    # FafnirServer serves both its /secrets/* API and its bundled web console at /console on this
    # same port (TopologyParser's DEFAULT_FAFNIR_PORT, unoverridden by topology-bundled-jre.yaml).
    ports:
      - "9092:9092"

  controlplane:
    <<: *gimle-light-service
    command: ["controlplane"]
    volumes:
      - gimle-install:/opt/gimle:ro
      - ./topology-bundled-jre.yaml:/config/topology.yaml:ro
      - ./entrypoint.sh:/holmgang/entrypoint.sh:ro
      - controlplane-data:/data
    ports:
      - "8080:8080"

  agent:
    image: eclipse-temurin:25-jre
    networks: [gimle]
    entrypoint: ["/bin/sh", "-c", 'tr -d "\r" < /holmgang/entrypoint.sh > /tmp/entrypoint.sh && exec /bin/sh /tmp/entrypoint.sh "$$@"', "--"]
    depends_on:
      unpack:
        condition: service_completed_successfully
    command: ["agent"]
    volumes:
      - gimle-install:/opt/gimle:ro
      - ./topology-bundled-jre.yaml:/config/topology.yaml:ro
      - ./entrypoint.sh:/holmgang/entrypoint.sh:ro
      - agent-data:/data

networks:
  gimle: {}

volumes:
  gimle-install: {}
  store-data: {}
  muninn-data: {}
  andvari-data: {}
  fafnir-data: {}
  controlplane-data: {}
  agent-data: {}
