name: compose-bundled-jre
transport: plaintext

# Identical to topology-full-jre.yaml except useBundledJre: true -- store/muninn/andvari/fafnir/
# controlplane each resolve their own java from ${GIMLE_HOME}/jre/<component>/bin/java (the bundled
# jlink image gimle-dist's dist-with-jre profile produced), never from runtime.javaExecutable
# below. agent (and the worker JVMs it spawns) is structurally excluded from that resolution --
# LaunchPlanner.planAgents never even looks at useBundledJre -- so it always uses plain
# javaExecutable, which is why docker-compose.bundled-jre.yml still gives agent's own container a
# real eclipse-temurin:25-jre image while every other service here runs on a bare debian-slim base
# with no JRE of its own at all.

machines:
  - name: store
    host: store
  - name: muninn
    host: muninn
  - name: andvari
    host: andvari
  - name: fafnir
    host: fafnir
  - name: controlplane
    host: controlplane
  - name: agent
    host: agent

runtime:
  javaExecutable: java
  classpath: /opt/gimle/lib/*
  dataRoot: /data
  useBundledJre: true

# AnsiPalette's own auto-detection (see gimle-core) turns color off here by default: each process's
# console output is redirect-to-file, not a real terminal, from the JVM's own point of view, the
# same as any other piped/redirected command. But entrypoint.sh's whole reason for tailing that file
# back onto this container's stdout is so a person watches it live via "docker logs -f"/Docker
# Desktop, in a real color-capable terminal -- so force color on rather than let the redirect
# silently disable it for every process an operator is actually meant to be looking at directly.
jvm:
  store: ["-Dgimle.color=always"]
  controlPlane: ["-Dgimle.color=always"]
  fafnir: ["-Dgimle.color=always"]
  muninn: ["-Dgimle.color=always"]
  andvari: ["-Dgimle.color=always"]
  agent: ["-Dgimle.color=always"]

store:
  replicas:
    - machine: store

muninn:
  replicas:
    - machine: muninn

andvari:
  replicas:
    - machine: andvari

fafnir:
  keyFile: /data/fafnir.key
  replicas:
    - machine: fafnir

controlPlane:
  replicas:
    - machine: controlplane

agents:
  - machine: agent
    nodeId: agent-0
