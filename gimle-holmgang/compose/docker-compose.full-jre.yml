# The baseline scenario: every service runs the same eclipse-temurin:25-jre image, matching a
# gimle-platform archive built WITHOUT gimle-dist's dist-with-jre profile (no jre/<component>/
# directory exists in it, so runtime.useBundledJre stays false in topology-full-jre.yaml).
#
# Prerequisite (see ../README.md#docker-compose-manual-validation): build the archive -- nothing
# else. GIMLE_DIST_TARGET already defaults to the reactor's own gimle-dist/target/, and the
# "unpack" service below extracts whichever gimle-platform-<version>.tar.gz it finds there into a
# shared volume before any other service starts, so there is no tarball path or version to type --
#   mvn -pl gimle-dist -am install
#   docker compose -f docker-compose.full-jre.yml up

x-gimle-service: &gimle-service
  image: eclipse-temurin:25-jre
  networks: [gimle]
  # Sanitizes entrypoint.sh into /tmp before running it, rather than executing the bind-mounted
  # file directly: a script checked out on Windows with CRLF line endings (a contributor's own
  # core.autocrlf, or a working tree from before .gitattributes normalized this repo) breaks
  # outright under /bin/sh regardless of what .gitattributes now says, since that only governs
  # future checkouts. This makes the container robust to the host's checkout state instead of
  # depending on it. "$@" carries the machine name from this service's own "command:" through.
  entrypoint: ["/bin/sh", "-c", 'tr -d "\r" < /holmgang/entrypoint.sh > /tmp/entrypoint.sh && exec /bin/sh /tmp/entrypoint.sh "$$@"', "--"]
  depends_on:
    unpack:
      condition: service_completed_successfully

services:
  unpack:
    image: eclipse-temurin:25-jre
    networks: [gimle]
    entrypoint: ["/bin/sh", "-c", 'tr -d "\r" < /holmgang/unpack.sh > /tmp/unpack.sh && exec /bin/sh /tmp/unpack.sh']
    volumes:
      - ${GIMLE_DIST_TARGET:-../../gimle-dist/target}:/dist:ro
      - ./unpack.sh:/holmgang/unpack.sh:ro
      - gimle-install:/opt/gimle

  store:
    <<: *gimle-service
    command: ["store"]
    volumes:
      - gimle-install:/opt/gimle:ro
      - ./topology-full-jre.yaml:/config/topology.yaml:ro
      - ./entrypoint.sh:/holmgang/entrypoint.sh:ro
      - store-data:/data

  muninn:
    <<: *gimle-service
    command: ["muninn"]
    volumes:
      - gimle-install:/opt/gimle:ro
      - ./topology-full-jre.yaml:/config/topology.yaml:ro
      - ./entrypoint.sh:/holmgang/entrypoint.sh:ro
      - muninn-data:/data

  andvari:
    <<: *gimle-service
    command: ["andvari"]
    volumes:
      - gimle-install:/opt/gimle:ro
      - ./topology-full-jre.yaml:/config/topology.yaml:ro
      - ./entrypoint.sh:/holmgang/entrypoint.sh:ro
      - andvari-data:/data

  fafnir:
    <<: *gimle-service
    command: ["fafnir"]
    volumes:
      - gimle-install:/opt/gimle:ro
      - ./topology-full-jre.yaml:/config/topology.yaml:ro
      - ./entrypoint.sh:/holmgang/entrypoint.sh:ro
      - fafnir-data:/data

  controlplane:
    <<: *gimle-service
    command: ["controlplane"]
    volumes:
      - gimle-install:/opt/gimle:ro
      - ./topology-full-jre.yaml:/config/topology.yaml:ro
      - ./entrypoint.sh:/holmgang/entrypoint.sh:ro
      - controlplane-data:/data
    ports:
      - "8080:8080"

  agent:
    <<: *gimle-service
    command: ["agent"]
    volumes:
      - gimle-install:/opt/gimle:ro
      - ./topology-full-jre.yaml:/config/topology.yaml:ro
      - ./entrypoint.sh:/holmgang/entrypoint.sh:ro
      - agent-data:/data

networks:
  gimle: {}

volumes:
  gimle-install: {}
  store-data: {}
  muninn-data: {}
  andvari-data: {}
  fafnir-data: {}
  controlplane-data: {}
  agent-data: {}
