# The baseline scenario: every service runs the same eclipse-temurin:25-jre image, matching a
# gimle-platform archive built WITHOUT gimle-dist's dist-with-jre profile (no jre/<component>/
# directory exists in it, so runtime.useBundledJre stays false in topology-full-jre.yaml).
#
# Prerequisite (see ../README.md#docker-compose-manual-validation): build the archive and point
# GIMLE_PLATFORM_DIR at its unpacked directory before running this file --
#   mvn -pl gimle-dist -am install
#   tar xzf gimle-dist/target/gimle-platform-<version>.tar.gz -C /tmp/gimle-full-jre
#   export GIMLE_PLATFORM_DIR=/tmp/gimle-full-jre/gimle-platform-<version>
#   docker compose -f docker-compose.full-jre.yml up

x-gimle-service: &gimle-service
  image: eclipse-temurin:25-jre
  networks: [gimle]
  entrypoint: ["/bin/sh", "/holmgang/entrypoint.sh"]

services:
  store:
    <<: *gimle-service
    command: ["store"]
    volumes:
      - ${GIMLE_PLATFORM_DIR:?set GIMLE_PLATFORM_DIR to an unpacked gimle-platform archive}:/opt/gimle:ro
      - ./topology-full-jre.yaml:/config/topology.yaml:ro
      - ./entrypoint.sh:/holmgang/entrypoint.sh:ro
      - store-data:/data

  muninn:
    <<: *gimle-service
    command: ["muninn"]
    volumes:
      - ${GIMLE_PLATFORM_DIR:?}:/opt/gimle:ro
      - ./topology-full-jre.yaml:/config/topology.yaml:ro
      - ./entrypoint.sh:/holmgang/entrypoint.sh:ro
      - muninn-data:/data

  andvari:
    <<: *gimle-service
    command: ["andvari"]
    volumes:
      - ${GIMLE_PLATFORM_DIR:?}:/opt/gimle:ro
      - ./topology-full-jre.yaml:/config/topology.yaml:ro
      - ./entrypoint.sh:/holmgang/entrypoint.sh:ro
      - andvari-data:/data

  fafnir:
    <<: *gimle-service
    command: ["fafnir"]
    volumes:
      - ${GIMLE_PLATFORM_DIR:?}:/opt/gimle:ro
      - ./topology-full-jre.yaml:/config/topology.yaml:ro
      - ./entrypoint.sh:/holmgang/entrypoint.sh:ro
      - fafnir-data:/data

  controlplane:
    <<: *gimle-service
    command: ["controlplane"]
    volumes:
      - ${GIMLE_PLATFORM_DIR:?}:/opt/gimle:ro
      - ./topology-full-jre.yaml:/config/topology.yaml:ro
      - ./entrypoint.sh:/holmgang/entrypoint.sh:ro
      - controlplane-data:/data
    ports:
      - "8080:8080"

  agent:
    <<: *gimle-service
    command: ["agent"]
    volumes:
      - ${GIMLE_PLATFORM_DIR:?}:/opt/gimle:ro
      - ./topology-full-jre.yaml:/config/topology.yaml:ro
      - ./entrypoint.sh:/holmgang/entrypoint.sh:ro
      - agent-data:/data

networks:
  gimle: {}

volumes:
  store-data: {}
  muninn-data: {}
  andvari-data: {}
  fafnir-data: {}
  controlplane-data: {}
  agent-data: {}
