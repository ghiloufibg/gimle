# No health: section -- a Job-kind module runs to completion, never "ready to serve", so there's
# nothing for a liveness/readiness probe to answer. TIER_1 (shared worker): this module's own
# local work (generating orders, dispatching, tallying) is light -- the real work happens in
# inventory-reservation/payment-service/shipping-service's own dedicated workers.
name: com.example.orderfulfillment.orchestrator
version: 1.0.0
isolation:
  tier: TIER_1
resources:
  request:
    memory: 96Mi
    cpu: 50m
  limit:
    memory: 256Mi
    cpu: 300m
lifecycle:
  jobHooks: com.example.orderfulfillment.orchestrator.SagaOrchestratorHooks
