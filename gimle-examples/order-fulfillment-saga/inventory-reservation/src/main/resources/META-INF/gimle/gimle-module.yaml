name: com.example.orderfulfillment.inventory
version: 1.0.0
isolation:
  tier: TIER_2
resources:
  request:
    memory: 32Mi
    cpu: 20m
  limit:
    memory: 128Mi
    cpu: 300m
exports:
  - service: com.example.orderfulfillment.InventoryReservationService
    version: 1.0.0
lifecycle:
  hooks: com.example.orderfulfillment.inventory.InventoryReservationHooks
health:
  liveness: com.example.orderfulfillment.inventory.InventoryReservationLivenessProbe
  readiness: com.example.orderfulfillment.inventory.InventoryReservationReadinessProbe
