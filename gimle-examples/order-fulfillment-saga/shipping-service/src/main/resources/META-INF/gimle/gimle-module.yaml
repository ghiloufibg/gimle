name: com.example.orderfulfillment.shipping
version: 1.0.0
isolation:
  tier: TIER_2
resources:
  request:
    memory: 32Mi
    cpu: 20m
  limit:
    memory: 128Mi
    cpu: 300m
exports:
  - service: com.example.orderfulfillment.ShippingService
    version: 1.0.0
lifecycle:
  hooks: com.example.orderfulfillment.shipping.ShippingServiceHooks
health:
  liveness: com.example.orderfulfillment.shipping.ShippingServiceLivenessProbe
  readiness: com.example.orderfulfillment.shipping.ShippingServiceReadinessProbe
