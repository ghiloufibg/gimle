# kind: NetworkPolicy -- like service.yaml, not one of the five workload manifest kinds, so this
# is checked-in documentation for a POST /networkpolicies body, not something `gimle:deploy`
# consumes:
#
#   curl -X POST http://localhost:8080/networkpolicies -H 'Content-Type: application/json' \
#     -d '{"name":"web-ui-deny-cross-tenant","tenantId":"orders-platform",
#          "deploymentNames":["web-ui-deployment"],"allowedCallerTenantIds":[]}'
#
# Deliberately optional, and honest about what it does and doesn't cover in this single-tenant
# sandbox app -- see ../README.md's "Restricting cross-tenant access (optional)" section for the
# full explanation. Short version: web-ui exports no fabric service of its own (it only consumes
# OrderCatalog/InventoryLevels), so FabricServer.checkNetworkPolicyPermitted has nothing here to
# gate -- that check only ever applies to a module that exports one, which in this app means
# orders-service/inventory-service, and neither is tenant-scoped (deliberately, for the
# config-delivery reasons ../README.md already documents), so a NetworkPolicySpec can't target
# them without first giving them a tenant, which this file doesn't do. What this policy *does* do:
# demonstrates Bifrost's own fail-closed behavior (com.gimle.agent.bifrost.BifrostProxy) --
# if Bifrost is enabled on the node hosting web-ui, this policy makes it refuse to proxy web-ui's
# Service to any same-node caller, since Bifrost has no caller identity to check the policy's
# allow list against. It has no effect on the gateway.routes SERVICE route in ../README.md, which
# is unrelated to NetworkPolicySpec by design -- gateway exposure is an operator's own opt-in
# publishing decision, not inter-tenant fabric traffic.
name: web-ui-deny-cross-tenant
tenantId: orders-platform
deploymentNames:
  - web-ui-deployment
allowedCallerTenantIds: []
