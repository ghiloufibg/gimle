name: com.example.orders
version: 1.0.0
isolation:
  tier: TIER_2
resources:
  request:
    memory: 96Mi
    cpu: 50m
  limit:
    memory: 192Mi
    cpu: 200m
exports:
  - service: com.example.orders.OrderCatalog
    version: 1.0.0
lifecycle:
  hooks: com.example.orders.provider.OrdersServiceHooks
health:
  liveness: com.example.orders.provider.OrdersLivenessProbe
  readiness: com.example.orders.provider.OrdersReadinessProbe
