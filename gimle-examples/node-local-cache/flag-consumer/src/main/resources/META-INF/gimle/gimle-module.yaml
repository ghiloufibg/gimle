name: com.example.nodelocalcache.consumer
version: 1.0.0
isolation:
  tier: TIER_2
resources:
  request:
    memory: 32Mi
    cpu: 20m
  limit:
    memory: 64Mi
    cpu: 100m
lifecycle:
  hooks: com.example.nodelocalcache.consumer.FlagConsumerHooks
health:
  liveness: com.example.nodelocalcache.consumer.FlagConsumerLivenessProbe
  readiness: com.example.nodelocalcache.consumer.FlagConsumerReadinessProbe
