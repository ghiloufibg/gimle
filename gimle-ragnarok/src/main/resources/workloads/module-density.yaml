# The platform's central claim -- classloader-grade Tier 1 density -- as a config: pack many
# single-replica deployments of one reference module across a two-node cluster, at a controlled
# rate, and measure how the scheduler and startup path behave as packing deepens.
#
# The iteration count is deliberately modest so the committed reference runs quickly; multiply it
# with -Dgimle.surtr.scale=N (e.g. 10) for a real density run on capable hardware.
name: module-density
topology: topologies/surtr-density.yaml

jobs:
  - name: fill
    type: create
    iterations: 10
    qps: 8
    burst: 10
    objects:
      - kind: deployment
        name: "burn-greeter-{{iteration}}"
        module: greeter-provider
        replicas: 1
    waitForActiveSeconds: 180

measurements:
  - instanceStartupLatency
  - apiLatency
  - failures
  - placementSpread

gates:
  maxFailedSubmissions: 0
  maxNeverActive: 0

gc: true
