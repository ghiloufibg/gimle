# One command to a ready-to-use Gimlé cluster: docker compose up -d
#
# init: true is required, not cosmetic -- "hilmir up" spawns every platform process detached, so
# they reparent to PID 1, and only a real init process reaps them when they exit (see
# midgard/entrypoint.sh). The named volume keeps cluster state (store data, secrets, pushed
# artifacts, logs) across container recreation; "docker compose down -v" resets to a fresh cluster.
services:
  midgard:
    build: .
    image: gimle-midgard:${project.version}
    container_name: gimle-midgard
    init: true
    stop_grace_period: 60s
    restart: unless-stopped
    ports:
      - "8080:8080" # control plane API + web console (/console)
      - "9092:9092" # fafnir secrets API + console (/console)
      - "9093:9093" # muninn observability API
      - "9094:9094" # andvari artifact registry API + console (/console)
    environment:
      # Set to "false" to boot an empty cluster with no example modules seeded.
      MIDGARD_SEED: "true"
    volumes:
      - midgard-data:/var/lib/gimle

volumes:
  midgard-data:
