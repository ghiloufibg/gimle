# The single-machine cluster this image boots: every process kind Hilmir can place -- store,
# control plane, Fafnir, Muninn, Andvari, one node agent -- on one machine named "midgard".
#
# host is 127.0.0.1 deliberately: every server in the platform binds the wildcard address and
# only *advertises* this host, so processes inside the container reach each other over loopback
# while Docker's published ports still reach every listener from outside the container.
#
# The six platform -Xmx caps below sum to ~1.06 GiB (192m+256m+128m+160m+160m+160m); this leaves
# under 1 GiB of headroom in the README's "give the Docker VM at least 2 GiB" guidance for every
# worker JVM the cluster is actually running -- and that headroom disappears fast. Worker JVMs are
# deliberately left uncapped here: each worker's heap ceiling is assigned per module from its own
# manifest's resource limit (not from this file, and a topology-wide -Xmx here would silently
# override that), and a single shared (TIER_1) worker commonly requests 1 GiB on its own in this
# repo's own example/test manifests -- one such worker alone already exceeds the platform
# processes' combined footprint. Left running, forgotten QA/example deployments are cumulative:
# each replica keeps its own worker JVM's -Xmx reserved for as long as it stays scheduled, so a
# container that has accumulated dozens of leftover instances can commit far more memory than this
# comment's 2 GiB assumption without any single process being individually oversized. Raising the
# `jvm:` values below only changes the six platform processes' own ceilings -- it does not bound
# worker JVM count or size; keeping this cluster's real footprint near the documented budget is an
# operator hygiene concern (delete deployments you're done with) more than a topology-config one.
name: midgard
machines:
  - {name: midgard, host: 127.0.0.1}
runtime:
  # An explicit, enumerated jar list rather than the "/opt/gimle/lib/*" wildcard: Sleipnir's AOT
  # worker cache (gimle-agent's SleipnirCache, mirroring JEP 483's own eligibility rule) requires
  # every classpath entry to be an actual regular .jar file, and a wildcard token never qualifies --
  # it disables AOT caching for every worker this topology launches. This list is exactly the lib/
  # produced by the Midgard assembly (component-cluster-jars.xml's runtime dependency closure) for
  # this project version; it must be regenerated (re-list /opt/gimle/lib/*.jar from a built Midgard
  # image or archive) whenever a dependency version or the project version changes, or a stale entry
  # here will point at a jar that no longer exists.
  classpath: "/opt/gimle/lib/HdrHistogram-2.2.2.jar:/opt/gimle/lib/LatencyUtils-2.0.3.jar:/opt/gimle/lib/bcpkix-jdk18on-1.85.jar:/opt/gimle/lib/bcprov-jdk18on-1.85.jar:/opt/gimle/lib/bcutil-jdk18on-1.85.jar:/opt/gimle/lib/gimle-agent-0.1.0-alpha.2.jar:/opt/gimle/lib/gimle-andvari-0.1.0-alpha.2.jar:/opt/gimle/lib/gimle-andvari-console-0.1.0-alpha.2.jar:/opt/gimle/lib/gimle-cli-0.1.0-alpha.2.jar:/opt/gimle/lib/gimle-console-0.1.0-alpha.2.jar:/opt/gimle/lib/gimle-controlplane-0.1.0-alpha.2.jar:/opt/gimle/lib/gimle-core-0.1.0-alpha.2.jar:/opt/gimle/lib/gimle-fabric-0.1.0-alpha.2.jar:/opt/gimle/lib/gimle-fafnir-0.1.0-alpha.2.jar:/opt/gimle/lib/gimle-fafnir-console-0.1.0-alpha.2.jar:/opt/gimle/lib/gimle-hilmir-0.1.0-alpha.2.jar:/opt/gimle/lib/gimle-hugin-0.1.0-alpha.2.jar:/opt/gimle/lib/gimle-ivaldi-0.1.0-alpha.2.jar:/opt/gimle/lib/gimle-ivaldi-console-0.1.0-alpha.2.jar:/opt/gimle/lib/gimle-mimir-0.1.0-alpha.2.jar:/opt/gimle/lib/gimle-module-0.1.0-alpha.2.jar:/opt/gimle/lib/gimle-muninn-0.1.0-alpha.2.jar:/opt/gimle/lib/gimle-observability-0.1.0-alpha.2.jar:/opt/gimle/lib/gimle-os-0.1.0-alpha.2.jar:/opt/gimle/lib/gimle-pki-0.1.0-alpha.2.jar:/opt/gimle/lib/gimle-ragnarok-0.1.0-alpha.2.jar:/opt/gimle/lib/gimle-skald-0.1.0-alpha.2.jar:/opt/gimle/lib/gimle-testkit-0.1.0-alpha.2.jar:/opt/gimle/lib/gimle-worker-0.1.0-alpha.2.jar:/opt/gimle/lib/jline-terminal-3.30.4.jar:/opt/gimle/lib/jline-terminal-ffm-3.30.4.jar:/opt/gimle/lib/jspecify-1.0.0.jar:/opt/gimle/lib/logback-classic-1.5.18.jar:/opt/gimle/lib/logback-core-1.5.18.jar:/opt/gimle/lib/micrometer-commons-1.16.3.jar:/opt/gimle/lib/micrometer-core-1.16.3.jar:/opt/gimle/lib/micrometer-observation-1.16.3.jar:/opt/gimle/lib/opentelemetry-api-1.64.0.jar:/opt/gimle/lib/opentelemetry-common-1.64.0.jar:/opt/gimle/lib/opentelemetry-context-1.64.0.jar:/opt/gimle/lib/opentelemetry-exporter-logging-1.64.0.jar:/opt/gimle/lib/opentelemetry-sdk-1.64.0.jar:/opt/gimle/lib/opentelemetry-sdk-common-1.64.0.jar:/opt/gimle/lib/opentelemetry-sdk-logs-1.64.0.jar:/opt/gimle/lib/opentelemetry-sdk-metrics-1.64.0.jar:/opt/gimle/lib/opentelemetry-sdk-trace-1.64.0.jar:/opt/gimle/lib/slf4j-api-2.0.17.jar:/opt/gimle/lib/snakeyaml-2.3.jar"
  dataRoot: /var/lib/gimle
store:
  replicas:
    - {machine: midgard}
controlPlane:
  replicas:
    - {machine: midgard}
fafnir:
  keyFile: /var/lib/gimle/fafnir-secret.key
  replicas:
    - {machine: midgard}
muninn:
  replicas:
    - {machine: midgard}
andvari:
  replicas:
    - {machine: midgard}
agents:
  - {machine: midgard, nodeId: midgard-node}
jvm:
  store: ["-Xmx192m"]
  controlPlane: ["-Xmx256m"]
  fafnir: ["-Xmx128m"]
  muninn: ["-Xmx160m"]
  andvari: ["-Xmx160m"]
  # The agent tracks per-instance bookkeeping (SupervisedInstance, capacity accounting, log/metric
  # shippers) for every worker it supervises, so its own headroom needs matter more here than for
  # the other five processes as instance count grows -- 224m over the previous 160m gives it more
  # room before its own heap comes under pressure. This does not make the agent fail fast on real
  # exhaustion (it has no -XX:+ExitOnOutOfMemoryError today, unlike the workers it spawns); that
  # flag belongs on the agent's own launch, not in this topology-config lever.
  agent: ["-Xmx224m"]
