# Filtered by maven-resources-plugin (see gimle-core/pom.xml's <resources> section) -- the one
# place a running process learns its own build version, read at startup by GimleVersion. Lives in
# a separate resources-filtered/ directory, not alongside banner.txt/banner-ascii.txt in the
# default (unfiltered) resources/ dir: those two files carry their own runtime ${...} placeholders
# (app.name, C_GOLD, ...) that Maven's own ${*} filtering would otherwise try to resolve at build
# time and corrupt.
version=${project.version}
