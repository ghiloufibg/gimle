name: Nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # The maven-build-cache-extension's own local cache (.mvn/extensions.xml,
      # .mvn/maven-build-cache-config.xml -- enabled repo-wide, opted out per-module for
      # gimle-smoke-tests/gimle-console/gimle-fafnir-console/gimle-andvari-console/gimle-docs, see those poms' own
      # maven.build.cache.enabled overrides). Keying on github.sha means every run always writes
      # a fresh entry (no same-key overwrite races); restore-keys falls back branch-first, then
      # to any branch, so a PR with only one module's diff restores every other module's already-
      # built-and-verified output from the most recent applicable run instead of rebuilding it.
      - name: Cache Maven build cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/build-cache
          key: ${{ runner.os }}-buildcache-${{ github.event.pull_request.base.ref || github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildcache-${{ github.event.pull_request.base.ref || github.ref_name }}-
            ${{ runner.os }}-buildcache-

      # gimle-console/gimle-fafnir-console/gimle-andvari-console/gimle-docs each shell out to
      # `bun install --frozen-lockfile` (exec-maven-plugin); this warms Bun's own global module
      # cache so that resolves from disk instead of refetching every package from the registry on
      # every run.
      - name: Cache Bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('gimle-console/bun.lock', 'gimle-fafnir-console/bun.lock', 'gimle-andvari-console/bun.lock', 'gimle-docs/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      # Real subprocess-cluster smoke suite (spawns ControlPlaneMain/AgentMain/WorkerMain and
      # friends, deploys the greeter modules, runs the console's Playwright suite against the
      # live cluster). Slow and opt-in -- not part of the default `mvn verify` in ci.yml.
      - name: mvn verify -Psmoke
        id: smoke
        continue-on-error: true
        run: mvn -B verify -Psmoke

      # Functional cluster validation (Gherkin scenarios over real subprocess topologies, plus
      # the Fenrir chaos soak and Surtr scale/churn burns). Also slow and opt-in.
      - name: mvn verify -Pvalidation
        id: validation
        continue-on-error: true
        run: mvn -B verify -Pvalidation

      # Full plugin coordinate rather than the short com.gimle:flaky-tests prefix, so this needs
      # no ~/.m2/settings.xml <pluginGroups> entry in this runner's environment. Repeated several
      # times in a row (not just once) -- the point of a nightly-only lane for known-flaky tests
      # is to keep accumulating real pass/fail evidence run over run, not a single snapshot.
      - name: mvn gimle:flaky-tests
        id: flaky-tests
        continue-on-error: true
        run: mvn -B com.gimle:gimle-maven-plugin:flaky-tests -Dgimle.flakyTests.repeat=10

      # Seeded ClassOrderer.Random pass over the default `mvn verify` scope (deliberately not
      # -Psmoke/-Pvalidation -- out of scope for this lane) to flush test-class order-dependence
      # bugs that a fixed declaration order never exercises. The seed is generated and logged
      # here, not left to JUnit's own default-seed log line (which needs elevated
      # java.util.logging configuration to even see), so a failure is reproducible by rerunning
      # with the same -Djunit.jupiter.execution.order.random.seed value. Surefire forwards -D
      # system properties given on this command line straight into each forked test JVM's own
      # system properties, and `junit.jupiter.testclass.order.default`/
      # `junit.jupiter.execution.order.random.seed` aren't already fixed in the root pom's own
      # hardcoded Surefire `configurationParameters` block (only the parallel-execution keys are),
      # so JUnit Platform's own configuration-parameter lookup falls through to these system
      # properties for both -- verified locally against this repo's own pinned JUnit 5.11.4.
      - name: mvn verify (seeded class order)
        id: seeded-order
        continue-on-error: true
        run: |
          seed="$(date +%s%N)"
          echo "ClassOrderer.Random seed: $seed"
          mvn -B verify \
            -Djunit.jupiter.testclass.order.default='org.junit.jupiter.api.ClassOrderer$Random' \
            -Djunit.jupiter.execution.order.random.seed="$seed"

      # Always upload, whatever the outcome above, so the raw Surefire/Failsafe XML (including
      # any rerun/flaky info) from all four lanes is available for inspection.
      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/*.xml"
          if-no-files-found: ignore

      - name: Annotate test results
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: "**/target/surefire-reports/*.xml"

      # Each lane above ran regardless of an earlier lane's outcome (continue-on-error); this is
      # the step that actually fails the job when any of them failed, so the workflow's own
      # pass/fail still reflects reality.
      - name: Fail if any lane failed
        if: always()
        run: |
          status=0
          if [ "${{ steps.smoke.outcome }}" != "success" ]; then
            echo "::error::mvn verify -Psmoke failed"
            status=1
          fi
          if [ "${{ steps.validation.outcome }}" != "success" ]; then
            echo "::error::mvn verify -Pvalidation failed"
            status=1
          fi
          if [ "${{ steps.flaky-tests.outcome }}" != "success" ]; then
            echo "::error::mvn com.gimle:gimle-maven-plugin:flaky-tests failed"
            status=1
          fi
          if [ "${{ steps.seeded-order.outcome }}" != "success" ]; then
            echo "::error::mvn verify (seeded class order) failed"
            status=1
          fi
          exit $status
