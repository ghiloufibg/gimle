name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # The maven-build-cache-extension's own local cache (.mvn/extensions.xml,
      # .mvn/maven-build-cache-config.xml -- enabled repo-wide, opted out per-module for
      # gimle-smoke-tests/gimle-console/gimle-fafnir-console/gimle-docs, see those poms' own
      # maven.build.cache.enabled overrides). Keying on github.sha means every run always writes
      # a fresh entry (no same-key overwrite races); restore-keys falls back branch-first, then
      # to any branch, so a PR with only one module's diff restores every other module's already-
      # built-and-verified output from the most recent applicable run instead of rebuilding it.
      - name: Cache Maven build cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/build-cache
          key: ${{ runner.os }}-buildcache-${{ github.event.pull_request.base.ref || github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildcache-${{ github.event.pull_request.base.ref || github.ref_name }}-
            ${{ runner.os }}-buildcache-

      # gimle-console/gimle-fafnir-console/gimle-docs each shell out to `bun install
      # --frozen-lockfile` (exec-maven-plugin); this warms Bun's own global module cache so that
      # resolves from disk instead of refetching every package from the registry on every run.
      - name: Cache Bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('gimle-console/bun.lock', 'gimle-fafnir-console/bun.lock', 'gimle-docs/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      # Same command a contributor runs locally (README/CLAUDE.md) -- no -pl/-am subset, so this
      # covers every module including gimle-console's Bun build/test and gimle-docs.
      - name: mvn verify
        run: mvn -B verify
